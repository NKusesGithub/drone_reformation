drones:
  # Must match the IDs enabled in the CrazySwarm crazyflies.yaml file.
  ids: [1, 2, 3, 4, 5, 6, 7, 8, 9]

  # crazyswarm = Docker 1 calls the current per-drone FastAPI service.
  # mock       = software-only smoke testing.
  # airsim     = retained legacy backend.
  mode: crazyswarm

  # CrazySwarm uses positive Z above the floor.
  hover_z: 1.0
  takeoff_duration: 2.0
  land_height: 0.04
  land_duration: 2.0
  command_settle_seconds: 0.25
  group_mask: 0
  control_timeout: 300.0

  vehicle_names:
    "1": cf1
    "2": cf2
    "3": cf3
    "4": cf4
    "5": cf5
    "6": cf6
    "7": cf7
    "8": cf8
    "9": cf9

  # Used by mock mode and by the retained AirSim compatibility backend.
  initial_positions:
    "1": [-0.5, 0.5, 0.0]
    "2": [0.0, 0.5, 0.0]
    "3": [0.5, 0.5, 0.0]
    "4": [-0.5, 0.0, 0.0]
    "5": [0.0, 0.0, 0.0]
    "6": [0.5, 0.0, 0.0]
    "7": [-0.5, -0.5, 0.0]
    "8": [0.0, -0.5, 0.0]
    "9": [0.5, -0.5, 0.0]

mission:
  old_formation: [1, 2, 3, 2, 1]
  formation_spacing: 0.5
  poll_interval: 1.0
  anchor_policy: initial_anchor

  safety_gap: 0.25
  include_downed_in_safety: false
  waypoint_step: 0.25
  move_velocity: 0.5
  target_tolerance: 0.05
  movement_poll_interval: 0.1
  command_timeout_margin: 3.0
  control_ready_timeout: 120.0
  max_move_seconds_per_drone: 120.0
  control_timeout: 300.0

  backward_penalty: 0.0
  backward_threshold: 0.0

visualizer:
  width: 900
  height: 700
  scale: 500.0
